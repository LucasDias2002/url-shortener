spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/url_shortener}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false